<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>Your Profile & Saved Rides | HiddenRides</title>
<meta name="description" content="View your HiddenRides profile and revisit the rides you saved for later.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#111315;--muted:#626b72;--line:#e2e5e7;--lime:#b7df00}*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1050px,92%);margin:auto}
header{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:23px;font-weight:950;letter-spacing:-1.5px}.logo b{color:#719000}nav{display:flex;gap:18px;font-size:13px;color:var(--muted)}
main{padding:48px 0 90px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#719000;font-weight:850}
h1{font-size:clamp(36px,6vw,58px);letter-spacing:-2.8px;line-height:1;margin:12px 0} .lead{color:var(--muted);line-height:1.6}
.account{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:20px;margin:28px 0 40px;background:#fafbf8}
.avatar{width:52px;height:52px;border-radius:50%;background:#eaf4c2;display:grid;place-items:center;font-weight:900;font-size:20px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}.account-info{flex:1;min-width:0}.account-info strong{display:block;overflow-wrap:anywhere}.account-info span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
button,.btn{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--lime);border-color:var(--lime)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.section-head h2{margin:0;font-size:25px;letter-spacing:-.8px}.count{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.ride{border:1px solid var(--line);border-radius:17px;padding:20px;min-width:0;background:#fff}.ride .symbol{width:38px;height:38px;border-radius:12px;background:#f0f5dc;display:grid;place-items:center;font-size:20px}.ride h3{font-size:17px;line-height:1.3;margin:18px 0 7px;overflow-wrap:anywhere}.ride p{font-size:12px;color:var(--muted);margin:0 0 18px}.ride-actions{display:flex;gap:8px;flex-wrap:wrap}.ride-actions a,.ride-actions button{font-size:11px;padding:9px 11px}.remove{color:#9b2929}
.empty,.notice{border:1px dashed #cfd4d6;border-radius:18px;padding:28px;text-align:center;color:var(--muted);line-height:1.6}.empty h3{color:var(--ink);margin:0 0 8px}.empty p{margin:0 auto 18px;max-width:440px;font-size:13px}
#status{min-height:20px;font-size:13px;color:var(--muted);margin:12px 0}#status.error{color:#b42318}
@media(max-width:700px){.grid{grid-template-columns:1fr}.account{align-items:flex-start;flex-wrap:wrap}.account-info{width:calc(100% - 75px)}.account>button{margin-left:68px}.section-head{align-items:start;flex-direction:column}nav{gap:12px}main{padding-top:35px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/supabase-config.js"></script>
</head><body><div class="wrap">
<header><a class="logo" href="/">HIDDEN<b>RIDES</b></a><nav><a href="/">Explore rides</a><a href="/discover">Discover</a></nav></header>
<main>
<div class="eyebrow">Your ride collection</div><h1>Your profile.</h1><p class="lead">Your account and every ride you save for another day, all in one place.</p>
<div class="account"><div class="avatar" id="avatar">R</div><div class="account-info"><strong id="userName">Checking your account…</strong><span id="userEmail"></span><span id="joined"></span></div><button id="signOut" type="button">Sign out</button></div>
<div class="section-head"><h2>Saved rides</h2><span class="count" id="count">Loading…</span></div>
<div id="status" role="status" aria-live="polite"></div><div id="rides" class="grid"></div>
</main></div>
<script>
(() => {
 const status=document.getElementById("status"), ridesEl=document.getElementById("rides"), count=document.getElementById("count");
 const say=(t,err=false)=>{status.textContent=t;status.className=err?"error":""};
 const url=window.HIDDENRIDES_SUPABASE_URL||"", key=window.HIDDENRIDES_SUPABASE_ANON_KEY||"";
 if(!window.supabase||url.includes("YOUR_PROJECT_REF")||key.includes("YOUR_SUPABASE")){say("Profile setup is incomplete. Configure Supabase and run supabase/saved_rides.sql as described in AUTH_SETUP.md.",true);count.textContent="Not configured";return}
 const db=window.supabase.createClient(url,key,{auth:{flowType:"pkce",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 async function load(){
   const {data:{session},error}=await db.auth.getSession();
   if(error){say("Could not load your session. Refresh and try again.",true);return}
   if(!session){location.replace("/auth.html?next="+encodeURIComponent("/profile.html"));return}
   const user=session.user, meta=user.user_metadata||{};
   document.getElementById("userName").textContent=meta.full_name||meta.name||"HiddenRides rider";
   document.getElementById("userEmail").textContent=user.email||"Google account";
   document.getElementById("joined").textContent="Member since "+new Date(user.created_at).toLocaleDateString(undefined,{month:"short",year:"numeric"});
   const avatar=document.getElementById("avatar");
   if(meta.avatar_url||meta.picture){avatar.innerHTML='<img alt="" referrerpolicy="no-referrer" src="'+escapeHtml(meta.avatar_url||meta.picture)+'">'}else{avatar.textContent=(meta.full_name||meta.name||user.email||"R").trim().charAt(0).toUpperCase()}
   const {data,error:queryError}=await db.from("saved_rides").select("id,ride_slug,title,city,ride_url,created_at").order("created_at",{ascending:false});
   if(queryError){say("Could not load saved rides. Check that you ran supabase/saved_rides.sql and enabled its RLS policies.",true);count.textContent="Unavailable";return}
   count.textContent=(data.length)+" saved "+(data.length===1?"ride":"rides");
   if(!data.length){ridesEl.className="";ridesEl.innerHTML='<div class="empty"><h3>No saved rides yet</h3><p>Open any ride guide and choose “Save ride” to keep it here for your next trip.</p><a class="btn primary" href="/discover">Discover rides ↗</a></div>';return}
   ridesEl.innerHTML=data.map(r=>'<article class="ride" data-id="'+escapeHtml(r.id)+'"><div class="symbol" aria-hidden="true">↗</div><h3>'+escapeHtml(r.title)+'</h3><p>'+escapeHtml(r.city)+' · Saved '+new Date(r.created_at).toLocaleDateString()+'</p><div class="ride-actions"><a class="btn primary" href="'+escapeHtml(r.ride_url)+'">View ride ↗</a><button class="remove" type="button" data-remove="'+escapeHtml(r.id)+'">Remove</button></div></article>').join("");
   ridesEl.querySelectorAll("[data-remove]").forEach(btn=>btn.addEventListener("click",async()=>{
     btn.disabled=true;const {error}=await db.from("saved_rides").delete().eq("id",btn.dataset.remove);
     if(error){say("Could not remove this ride. Please try again.",true);btn.disabled=false;return}
     say("Ride removed from your saved list.");await load();
   }));
   say("");
 }
 document.getElementById("signOut").addEventListener("click",async()=>{const {error}=await db.auth.signOut();if(error)say("Sign out failed. Please try again.",true);else location.href="/"});
 db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT")location.replace("/")});
 load();
})();
</script></body></html>

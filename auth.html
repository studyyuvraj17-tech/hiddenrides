<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Sign in | HiddenRides</title>
<meta name="description" content="Sign in to HiddenRides with your Google account.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--ink:#111315;--muted:#626b72;--line:#e2e5e7;--lime:#b7df00}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}
a{color:inherit}.top{position:absolute;top:26px;left:clamp(20px,5vw,64px);font-size:23px;font-weight:950;letter-spacing:-1.5px;text-decoration:none}.top b{color:#719000}
.panel{width:min(100%,440px);border:1px solid var(--line);border-radius:24px;padding:clamp(26px,6vw,42px);box-shadow:0 22px 70px rgba(17,19,21,.08)}
.mark{width:44px;height:44px;border-radius:14px;background:var(--lime);display:grid;place-items:center;font-size:22px;margin-bottom:24px}
h1{font-size:32px;letter-spacing:-1.3px;margin:0 0 10px}p{color:var(--muted);line-height:1.6;margin:0 0 25px;font-size:14px}
.google{width:100%;min-height:52px;border:1px solid #d5d9dc;border-radius:12px;background:#fff;color:#111315;font-weight:750;font-size:14px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.google:hover{background:#f7f8f6}.google:disabled{opacity:.6;cursor:wait}.g{font-weight:900;font-size:18px;color:#4285f4}
#status{min-height:22px;margin:16px 0 0;font-size:13px;color:var(--muted)}#status.error{color:#b42318}#status.success{color:#267342}
.profile{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.email{font-weight:700;overflow-wrap:anywhere;margin-bottom:14px}
.secondary{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 14px;cursor:pointer;font-weight:650}
.back{display:block;text-align:center;margin-top:24px;font-size:13px;color:var(--muted);text-decoration:none}.back:hover{color:var(--ink)}
.note{font-size:11px;color:#7a8288;margin-top:25px;line-height:1.55;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<a class="top" href="/">Hidden<b>Rides</b></a>
<main class="panel">
<div class="mark" aria-hidden="true">↗</div>
<h1 id="heading">Find your next ride.</h1>
<p id="intro">Sign in securely with Google to get started with HiddenRides.</p>
<button class="google" id="googleBtn" type="button"><span class="g" aria-hidden="true">G</span><span>Continue with Google</span></button>
<div id="status" role="status" aria-live="polite"></div>
<div class="profile" id="profile"><div class="email" id="email"></div><button class="secondary" id="signOut" type="button">Sign out</button></div>
<a class="back" href="/">← Back to HiddenRides</a>
<div class="note">Your sign-in is handled by Supabase and Google. HiddenRides never receives your Google password.</div>
</main>
<script>
(() => {
  // Replace these two public project values after creating your Supabase project.
  // The anon/publishable key is intended for browser use; never put a service-role key here.
  const SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";
  const btn = document.getElementById("googleBtn");
  const status = document.getElementById("status");
  const profile = document.getElementById("profile");
  const email = document.getElementById("email");
  const heading = document.getElementById("heading");
  const intro = document.getElementById("intro");
  const signOut = document.getElementById("signOut");
  const configured = !SUPABASE_URL.includes("YOUR_PROJECT_REF") && !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");
  let client = null;

  function message(text, type) {
    status.textContent = text;
    status.className = type || "";
  }
  function showUser(user) {
    if (!user) {
      profile.style.display = "none";
      btn.style.display = "flex";
      heading.textContent = "Find your next ride.";
      intro.textContent = "Sign in securely with Google to get started with HiddenRides.";
      return;
    }
    profile.style.display = "block";
    email.textContent = user.email || "Signed in with Google";
    btn.style.display = "none";
    heading.textContent = "You're signed in.";
    intro.textContent = "Welcome to HiddenRides. Your Google account is connected.";
    message("Signed in successfully.", "success");
  }
  if (!configured || !window.supabase) {
    btn.disabled = true;
    message("Google sign-in setup is not complete yet. Follow AUTH_SETUP.md in the GitHub repository to connect Supabase.", "error");
  } else {
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    client.auth.getSession().then(({data, error}) => {
      if (error) message("Could not check your session. Please refresh and try again.", "error");
      showUser(data && data.session ? data.session.user : null);
    });
    client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" && session) showUser(session.user);
      if (event === "SIGNED_OUT") showUser(null);
    });
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      message("Connecting to Google…");
      const {error} = await client.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/auth.html" }
      });
      if (error) {
        message(error.message || "Google sign-in failed. Please try again.", "error");
        btn.disabled = false;
      }
    });
    signOut.addEventListener("click", async () => {
      signOut.disabled = true;
      const {error} = await client.auth.signOut();
      if (error) message("Could not sign out. Please try again.", "error");
      else message("You have signed out.");
      signOut.disabled = false;
    });
  }
})();
</script>
</body>
</html>
